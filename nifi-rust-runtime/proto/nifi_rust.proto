// NiFi Rust Processor gRPC Service Definition
//
// This protocol defines the communication between the Java NiFi framework
// and the Rust processor runtime.

syntax = "proto3";

package nifi.rust;

option java_package = "org.apache.nifi.rust.grpc";
option java_outer_classname = "NifiRustProto";
option java_multiple_files = true;

// The main service for Rust processor management and execution
service RustProcessorService {
    // Get all available processor types
    rpc GetProcessorTypes(Empty) returns (ProcessorTypesResponse);

    // Create a new processor instance
    rpc CreateProcessor(CreateProcessorRequest) returns (ProcessorHandle);

    // Destroy a processor instance
    rpc DestroyProcessor(ProcessorHandle) returns (Empty);

    // Called when the processor is scheduled
    rpc OnScheduled(ScheduledRequest) returns (ScheduledResponse);

    // Called when the processor is stopped
    rpc OnStopped(StoppedRequest) returns (StoppedResponse);

    // Called for each trigger of the processor
    rpc OnTrigger(TriggerRequest) returns (TriggerResponse);

    // Streaming version of OnTrigger for high-throughput scenarios
    rpc OnTriggerStream(stream TriggerRequest) returns (stream TriggerResponse);

    // Health check
    rpc HealthCheck(Empty) returns (HealthResponse);
}

// Empty message for void requests/responses
message Empty {}

// Health check response
message HealthResponse {
    bool healthy = 1;
    string version = 2;
    int32 processor_count = 3;
}

// Processor type information
message ProcessorTypeInfo {
    string type_name = 1;
    string description = 2;
    repeated PropertyDescriptor properties = 3;
    repeated RelationshipInfo relationships = 4;
}

// Response containing all available processor types
message ProcessorTypesResponse {
    repeated ProcessorTypeInfo processor_types = 1;
}

// Property descriptor definition
message PropertyDescriptor {
    string name = 1;
    string display_name = 2;
    string description = 3;
    bool required = 4;
    string default_value = 5;
    bool sensitive = 6;
    bool expression_language_supported = 7;
    repeated string allowable_values = 8;
}

// Relationship information
message RelationshipInfo {
    string name = 1;
    string description = 2;
    bool auto_terminate = 3;
}

// Request to create a new processor
message CreateProcessorRequest {
    string processor_type = 1;
    string processor_id = 2;
    string processor_name = 3;
}

// Handle to an instantiated processor
message ProcessorHandle {
    string processor_id = 1;
    string processor_type = 2;
}

// Property value for configuration
message PropertyValue {
    string name = 1;
    oneof value {
        string string_value = 2;
        int64 int_value = 3;
        bool bool_value = 4;
        int64 duration_millis = 5;
    }
}

// Request for OnScheduled lifecycle method
message ScheduledRequest {
    string processor_id = 1;
    repeated PropertyValue properties = 2;
    int32 max_concurrent_tasks = 3;
    int64 scheduling_period_millis = 4;
}

// Response from OnScheduled
message ScheduledResponse {
    bool success = 1;
    string error_message = 2;
}

// Request for OnStopped lifecycle method
message StoppedRequest {
    string processor_id = 1;
}

// Response from OnStopped
message StoppedResponse {
    bool success = 1;
    string error_message = 2;
}

// FlowFile representation
message FlowFileProto {
    string id = 1;
    map<string, string> attributes = 2;
    bytes content = 3;
    uint64 size = 4;
    int64 entry_date = 5;
    int64 lineage_start_date = 6;
}

// Transfer target (FlowFile + relationship)
message TransferTarget {
    FlowFileProto flowfile = 1;
    string relationship = 2;
}

// Request for OnTrigger
message TriggerRequest {
    string processor_id = 1;
    repeated FlowFileProto input_flowfiles = 2;
}

// Response from OnTrigger
message TriggerResponse {
    bool success = 1;
    string error_message = 2;
    repeated TransferTarget transferred = 3;
    repeated string removed_ids = 4;
}
