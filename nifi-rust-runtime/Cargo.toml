[package]
name = "nifi-rust-runtime"
version = "0.1.0"
edition = "2021"
description = "gRPC runtime server for Rust NiFi processors"
license = "Apache-2.0"

[[bin]]
name = "nifi-rust-runtime"
path = "src/main.rs"

[dependencies]
# NiFi Rust API
nifi-rust-api = { path = "../nifi-rust-api" }

# gRPC / Protobuf
tonic = "0.12"
prost = "0.13"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Utils
uuid = { version = "1", features = ["v4"] }

# Streaming
async-stream = "0.3"
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.12"
